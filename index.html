<title>購買清單</title>
<style>
:root{
  --bg:#f1e8d9; --card:#faf5ea; --ink:#4a3d32; --sub:#7a6b58; --line:#e2d4bc;
  --head:#e1ccad; --accent:#b89a70; --accent-d:#9a744a; --warn:#b5602f; --danger:#a0493a;
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif;-webkit-text-size-adjust:100%}
body{padding-bottom:calc(110px + var(--safe-b))}
body.lock{overflow:hidden}
header{position:sticky;top:0;z-index:20;background:var(--head);color:var(--ink);padding:calc(10px + var(--safe-t)) 14px 0}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.top h1{font-size:18px;margin:0;font-weight:600;letter-spacing:.5px}
.iconbtn{background:transparent;border:0;color:var(--ink);font-size:24px;width:44px;height:44px;border-radius:22px}
.iconbtn:active{background:rgba(0,0,0,.08)}
.tabs{display:flex;gap:6px}
.tab{flex:1;border:0;background:rgba(255,255,255,.4);color:#6f604d;font-size:16px;padding:12px 0;border-radius:12px 12px 0 0;font-weight:600}
.tab.on{background:var(--bg);color:var(--ink)}
.tab small{font-weight:400;opacity:.85;margin-left:4px}
main{padding:14px}
.summary{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:14px}
.sumrow{display:flex;gap:10px}
.sumrow>div{flex:1;min-width:0}
.lbl{font-size:12px;color:var(--sub)}
.big{font-size:22px;font-weight:700;margin-top:2px;word-break:break-all}
.big.g{color:var(--accent-d)}
.loc{font-size:12px;color:var(--sub);margin-top:1px}
.rrow{display:flex;align-items:center;gap:6px;margin-top:10px;font-size:14px;color:var(--sub);flex-wrap:wrap}
.rrow input{width:96px;font-size:16px;padding:7px 10px;border:1px solid var(--line);border-radius:10px;background:#fffaf0;color:var(--ink);-webkit-appearance:none;appearance:none}
.amtc{text-align:right}
.amtc small{display:block;font-size:12px;color:var(--sub);font-weight:400}
details{margin-top:12px;border-top:1px dashed var(--line);padding-top:8px}
summary{font-size:14px;color:var(--accent-d);font-weight:600;padding:6px 0;list-style:none}
summary::-webkit-details-marker{display:none}
summary::after{content:" ▾"}
details[open] summary::after{content:" ▴"}
.person{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:15px}
.person>span:first-child{min-width:0;word-break:break-all}
.person:last-child{border-bottom:0}
.person .amt{text-align:right;flex:none}
.person .amt b{font-size:17px}
.person .amt span{display:block;font-size:12px;color:var(--sub)}
.grid{display:grid;grid-template-columns:1fr;gap:14px}
.card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:0 1px 3px rgba(80,55,30,.08)}
.card:focus-visible{outline:3px solid var(--accent-d)}
.card .ph{width:100%;aspect-ratio:4/3;background:#e6d9c3;display:flex;align-items:center;justify-content:center;color:var(--sub);font-size:14px;overflow:hidden}
.card .ph img{width:100%;height:100%;object-fit:cover;display:block}
.must .ph{aspect-ratio:1/1}
.must-grid{grid-template-columns:1fr 1fr}
.info{padding:12px 14px 14px}
.name{font-size:17px;font-weight:600;margin-bottom:6px;word-break:break-all}
.name.empty{color:var(--sub);font-weight:400}
.meta{font-size:14px;color:var(--sub)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 4px}
.chip{background:#efe2cb;color:var(--accent-d);border-radius:999px;padding:4px 10px;font-size:13px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tot{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-top:8px}
.tot b{font-size:18px}
.flag{color:var(--warn);font-weight:600}
.prow{display:flex;align-items:center;gap:8px}
.pwrap{display:flex;align-items:center;gap:4px;color:var(--sub)}
.pwrap input{width:112px;font-size:16px;padding:7px 10px;border:1px solid var(--line);border-radius:10px;background:#fffaf0;color:var(--ink);-webkit-appearance:none;appearance:none}
.pwrap input.nop{border-color:var(--warn);background:#fff3e2}
.chk{position:absolute;top:10px;right:10px;width:48px;height:48px;border-radius:24px;border:2px solid rgba(255,255,255,.95);background:rgba(60,42,30,.35);color:transparent;font-size:26px;font-weight:700;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.card.done .chk{background:var(--accent-d);color:#fff;border-color:#fff}
.card.done .ph{opacity:.45}
.card.done .name,.card.done .chips,.card.done .tot{opacity:.55}
.mfoot{justify-content:space-between;padding:8px 10px}
.mlbl{font-size:13px;color:var(--sub)}
.mqty{width:64px;font-size:17px;font-weight:600;text-align:center;color:var(--ink);padding:5px 6px;border:1px solid #cdbb9c;border-radius:8px;background:#fffaf0;-webkit-appearance:none;appearance:none}
.mqty.none{border-style:dashed;border-color:#d4c4a8}
.buybtn{display:block;width:100%;margin-top:12px;border:2px solid var(--accent-d);background:transparent;color:var(--accent-d);border-radius:12px;padding:12px;font-size:17px;font-weight:700}
.card.done .buybtn{background:var(--accent-d);color:#fff}
.grow{justify-content:space-between;margin-top:8px;font-size:14px;color:var(--ink)}
.grow>span{min-width:0;word-break:break-all}
.grow input{width:84px;flex:none;font-size:16px;padding:7px 10px;border:1px solid var(--line);border-radius:10px;background:#fffaf0;color:var(--ink);text-align:center;-webkit-appearance:none;appearance:none}
.empty-tip{text-align:center;color:var(--sub);padding:50px 20px;line-height:1.8}
.fab{position:fixed;right:18px;bottom:calc(20px + var(--safe-b));width:62px;height:62px;border-radius:31px;border:0;background:var(--accent-d);color:#fff;font-size:34px;line-height:1;box-shadow:0 4px 14px rgba(60,42,30,.35);z-index:30}
.fab:active{transform:scale(.95)}
.overlay{position:fixed;inset:0;background:rgba(40,28,20,.5);z-index:40;display:none}
.overlay.on{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:94vh;overflow:auto;background:var(--bg);border-radius:20px 20px 0 0;z-index:50;padding:16px 16px 0;transform:translateY(105%);visibility:hidden;transition:transform .25s ease,visibility 0s .25s;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.sheet.on{transform:none;visibility:visible;transition:transform .25s ease}
.sh{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.sh h2{margin:0;font-size:18px}
.trash{border:0;background:transparent;color:var(--danger);font-size:15px;font-weight:600;padding:10px 4px}
.actbar{position:sticky;bottom:0;background:var(--bg);padding:10px 0 calc(16px + var(--safe-b));margin-top:6px;box-shadow:0 -10px 10px -10px rgba(80,55,30,.25)}
.field{margin-bottom:14px}
.field>label{display:block;font-size:13px;color:var(--sub);margin-bottom:5px}
.sheet input[type=text],.sheet input[type=number],.sheet input[type=search]{width:100%;font-size:17px;padding:12px;border:1px solid var(--line);border-radius:12px;background:#fbf6ec;color:var(--ink);-webkit-appearance:none;appearance:none}
input:focus{outline:2px solid var(--accent-d);border-color:transparent}
.imgpick{position:relative;width:100%;aspect-ratio:4/3;background:#e6d9c3;border:2px dashed #bba98c;border-radius:14px;display:flex;align-items:center;justify-content:center;color:var(--sub);font-size:15px;overflow:hidden;text-align:center;line-height:1.7}
.imgpick img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.imgpick .re{position:absolute;right:8px;bottom:8px;background:rgba(60,42,30,.7);color:#fff;border-radius:10px;padding:5px 12px;font-size:13px}
.imgpick.sq{aspect-ratio:1/1;max-width:240px;margin-left:auto;margin-right:auto}
.crop{position:fixed;inset:0;z-index:85;background:#1d1611;color:#f4eadb;display:none;flex-direction:column;padding-top:var(--safe-t)}
.crop.on{display:flex}
.crop-top{display:flex;justify-content:space-between;align-items:baseline;padding:14px 16px 6px;font-size:17px;font-weight:600}
.crop-top small{font-size:12px;font-weight:400;opacity:.75}
.crop-stage{position:relative;flex:1;min-height:0}
.crop-stage canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;-webkit-user-select:none;user-select:none}
.crop-ctl{display:flex;align-items:center;gap:12px;padding:10px 20px;font-size:13px;opacity:.9}
.crop-ctl input{flex:1;accent-color:#c9a878}
.crop-bar{display:flex;gap:10px;padding:6px 16px calc(16px + var(--safe-b))}
.crop-bar .btn{flex:1;padding:14px 6px}
.brow{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.brow .who{flex:1.6;min-width:0}
.brow .q{flex:1;min-width:0;text-align:center}
.brow .del{width:40px;height:44px;border:0;background:transparent;color:var(--danger);font-size:22px;flex:none}
.bhead{display:flex;gap:8px;font-size:12px;color:var(--sub);margin-bottom:4px;padding-right:48px}
.bhead span{flex:1;text-align:center}.bhead span:first-child{flex:1.6;text-align:left}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:15px;font-size:17px;font-weight:600;background:var(--accent-d);color:#fff}
.btn:active{opacity:.85}
.btn.ghost{background:#e6d9c3;color:var(--ink)}
.btn.danger{background:transparent;color:var(--danger);border:1px solid var(--danger)}
.btn.dangersolid{background:var(--danger);color:#fff}
.btn.small{padding:11px;font-size:15px}
.row2{display:flex;gap:10px;margin-top:10px}
.row2 .btn{flex:1}
.toggle{display:flex;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:16px}
.sw{position:relative;width:52px;height:32px;flex:none}
.sw input{opacity:0;position:absolute;inset:0;width:100%;height:100%;margin:0}
.sw i{position:absolute;inset:0;background:#bfae93;border-radius:16px;transition:.2s}
.sw i::after{content:"";position:absolute;left:3px;top:3px;width:26px;height:26px;background:#fff;border-radius:13px;transition:.2s}
.sw input:checked+i{background:var(--accent-d)}
.sw input:checked+i::after{transform:translateX(20px)}
.hint{font-size:12px;color:var(--sub);margin-top:6px;line-height:1.6}
.toast{position:fixed;left:50%;bottom:calc(100px + var(--safe-b));transform:translateX(-50%);background:rgba(60,42,30,.92);color:#fff;padding:10px 18px;border-radius:20px;font-size:14px;z-index:90;opacity:0;pointer-events:none;transition:opacity .2s;max-width:86vw;text-align:center}
.toast.on{opacity:1}
.dlg{position:fixed;inset:0;z-index:80;display:none;align-items:center;justify-content:center;background:rgba(40,28,20,.5);padding:24px}
.dlg.on{display:flex}
.dlgbox{background:var(--bg);border-radius:18px;padding:20px;max-width:340px;width:100%}
.dlgbox p{margin:0 0 16px;font-size:16px;line-height:1.7;white-space:pre-line}
.dlgbox .row2{margin-top:0}
@media(min-width:700px){.grid{grid-template-columns:repeat(2,1fr)}.must-grid{grid-template-columns:repeat(4,1fr)}main{max-width:900px;margin:0 auto}}

/* ---- 1.7 質感調整 ---- */
:root{--serif:"Songti TC","Noto Serif TC","Source Han Serif TC","Hiragino Mincho ProN",serif;--shadow:0 1px 2px rgba(80,55,30,.06),0 8px 22px -10px rgba(80,55,30,.28)}
body{background:radial-gradient(120% 60% at 50% 0,#f6eee0 0,var(--bg) 70%) no-repeat,var(--bg)}
.top h1{font-family:var(--serif);font-size:21px;font-weight:800;letter-spacing:2px}
.tabs{gap:4px}
.tab{border-radius:14px 14px 0 0;transition:background .2s}
.tab.on{box-shadow:0 -2px 0 var(--accent-d) inset}
.summary{border-radius:22px;padding:16px 16px 14px;box-shadow:var(--shadow);border-color:#e8dcc6}
.big{font-family:var(--serif);font-size:26px;font-weight:800;letter-spacing:.3px}
.bar{height:6px;border-radius:3px;background:#eadfca;margin-top:12px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,#c9a878,var(--accent-d));transition:width .4s ease}
.alldone{margin-top:10px;font-family:var(--serif);font-weight:700;color:var(--accent-d);font-size:15px}
.card{border-radius:22px;box-shadow:var(--shadow);border-color:#e8dcc6;transition:transform .15s ease}
.card:active{transform:scale(.99)}
.name{font-family:var(--serif);font-size:19px;font-weight:800;letter-spacing:.3px;line-height:1.35}
.card .ph.noimg{aspect-ratio:16/7}
.must .ph.noimg{aspect-ratio:1/1}
.phch{display:flex;align-items:center;justify-content:center;width:100%;height:100%;font-family:var(--serif);font-size:56px;font-weight:800;opacity:.9}
.chk{transition:background .2s,transform .2s}
.card.pop .chk{animation:pop .42s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:scale(.4) rotate(-25deg)}100%{transform:none}}
.card.done{box-shadow:0 1px 2px rgba(80,55,30,.05);background:#f4ecdc}
.buybtn{border-radius:14px;transition:background .2s,color .2s}
.fab{box-shadow:0 10px 24px -6px rgba(60,42,30,.5)}
.sh h2,.dlgbox p{font-family:var(--serif)}
@media(prefers-reduced-motion:reduce){.card.pop .chk{animation:none}.bar i,.card{transition:none}}

var MAX_Q=9999,MAX_P=9999999;
var qint=function(v){return Math.min(MAX_Q,Math.max(0,Math.round(num(v))))};
var pnum=function(v){return Math.min(MAX_P,Math.max(0,Math.round(num(v)*100)/100))};
var clip=function(s,n){return String(s==null?'':s).slice(0,n)};
var okImg=function(s){return typeof s==='string'&&/^data:image\/(jpeg|png|webp|gif);base64,[A-Za-z0-9+\/=]+$/.test(s)};
var rnum=function(v){return Math.min(99999,Math.max(0,Math.round(num(v)*10000)/10000))};
var loc=function(n){n=Math.round(n*100)/100;return n.toLocaleString('zh-TW')};
var twd=function(n){return 'NT$'+Math.round(n*data.rate).toLocaleString('zh-TW')};
var hasRate=function(){return data.rate>0};
var money=function(n){return hasRate()?twd(n):loc(n)};
var noPrice=function(it){return it.price===''||it.price==null};

/* ---------- 儲存（IndexedDB，失敗時退回 localStorage） ---------- */
var DB={
  _p:null,
  open:function(){
    var self=this;if(self._p)return self._p;
    self._p=new Promise(function(res,rej){
      if(!window.indexedDB){self._p=null;return rej(new Error('no idb'))}
      var r=indexedDB.open('shoplist',1);
      r.onupgradeneeded=function(){r.result.createObjectStore('kv')};
      r.onsuccess=function(){var db=r.result;db.onversionchange=function(){db.close();self._p=null};res(db)};
      r.onerror=function(){self._p=null;rej(r.error||new Error('idb'))};
      r.onblocked=function(){self._p=null;rej(new Error('blocked'))};
    });
    return self._p;
  },
  get:function(k){
    return this.open().then(function(db){return new Promise(function(res,rej){
      var q=db.transaction('kv').objectStore('kv').get(k);
      q.onsuccess=function(){res(q.result)};q.onerror=function(){rej(q.error)};
    })}).catch(function(){try{return JSON.parse(localStorage.getItem('shoplist_'+k)||'null')}catch(e){return null}});
  },
  set:function(k,v){
    return this.open().then(function(db){return new Promise(function(res,rej){
      var tx=db.transaction('kv','readwrite');tx.objectStore('kv').put(v,k);
      tx.oncomplete=function(){res()};tx.onerror=function(){rej(tx.error)};tx.onabort=function(){rej(tx.error)};
    })}).catch(function(){try{localStorage.setItem('shoplist_'+k,JSON.stringify(v))}catch(e){toast('儲存失敗（空間不足），請先匯出備份')}});
  }
};

function normalize(d){
  var out={agent:[],must:[],rate:rnum(d&&d.rate)},seen={};
  var arr=function(x){return Array.isArray(x)?x:[]};
  var mkid=function(id){id=String(id==null?'':id).replace(/[^\w-]/g,'').slice(0,40);if(!id||seen[id])id=uid();seen[id]=1;return id};
  arr(d&&d.agent).forEach(function(it){
    if(!it||typeof it!=='object')return;
    var bs=arr(it.buyers).filter(function(b){return b&&typeof b==='object'}).map(function(b){
      var q=qint(b.qty==null?1:b.qty),g=(b.got==null||b.got==='')?null:qint(b.got);
      if(g===q)g=null;
      return{who:clip(b.who,16).trim(),qty:q,got:g};
    });
    if(!bs.length)bs=[{who:'',qty:1,got:null}];
    out.agent.push({id:mkid(it.id),img:okImg(it.img)?it.img:'',name:clip(it.name,40),price:(it.price===''||it.price==null)?'':pnum(it.price),done:!!it.done,buyers:bs});
  });
  arr(d&&d.must).forEach(function(it){
    if(!it||typeof it!=='object')return;
    var q=qint(it.qty);
    out.must.push({id:mkid(it.id),img:okImg(it.img)?it.img:'',qty:q?q:'',done:!!it.done});
  });
  return out;
}

/* ---------- 計算 ---------- */
function gotQty(it,b){return it.done?(b.got==null?num(b.qty):num(b.got)):0}
function calc(){
  var exp=0,got=0,n=data.agent.length,dn=0,ppl={};
  data.agent.forEach(function(it){
    if(it.done)dn++;
    var p=num(it.price);
    it.buyers.forEach(function(b){
      var q=num(b.qty),g=gotQty(it,b);
      exp+=p*q;got+=p*g;
      var k=(b.who||'').trim()||'未註明';
      var o=ppl[k]||(ppl[k]={exp:0,got:0});
      o.exp+=p*q;o.got+=p*g;
    });
  });
  return{exp:exp,got:got,n:n,dn:dn,ppl:ppl};
}

function updateCounts(){
  var a=data.agent,m=data.must;
  $('#cAgent').textContent=a.length?(a.filter(function(x){return x.done}).length+'/'+a.length):'';
  $('#cMust').textContent=m.length?(m.filter(function(x){return x.done}).length+'/'+m.length):'';

function render(){
  document.querySelectorAll('.tab').forEach(function(t){t.classList.toggle('on',t.dataset.tab===tab)});
  if(!ready){$('#main').innerHTML='<div class="empty-tip">載入中…</div>';return}
  updateCounts();
  var a=data.agent,m=data.must,h='';
  if(tab==='agent'){
    h+=summaryHTML();
    if(!a.length)h+='<div class="empty-tip">還沒有代購商品<br>按右下角「＋」新增</div>';
    else{h+='<div class="grid">';sortList(a).forEach(function(it){h+=agentCard(it)});h+='</div>'}
  }else{
    if(!m.length)h+='<div class="empty-tip">還沒有必買商品<br>按右下角「＋」新增</div>';
    else{h+='<div class="grid must-grid">';sortList(m).forEach(function(it){h+=mustCard(it)});h+='</div>'}
  }
  $('#main').innerHTML=h;
  $('#people').innerHTML=allNames().map(function(n){return '<option value="'+esc(n)+'">'}).join('');
}
/* 在輸入框之間切換時不整頁重畫（避免 iPhone 鍵盤被收起），只更新摘要 */
function inlineActive(){var a=document.activeElement;return !!(a&&a.tagName==='INPUT'&&$('#main').contains(a))}
function softRender(id){
  setTimeout(function(){
    if(inlineActive()){
      pendingRender=true;updateCounts();
      var sm=$('.summary');if(sm&&tab==='agent'&&!sm.contains(document.activeElement))sm.outerHTML=summaryHTML();
      if(id&&tab==='agent'){
        var it=data.agent.filter(function(x){return x.id===id})[0],tt=document.querySelector('.card[data-id="'+id+'"] .tot');
        if(it&&tt)tt.innerHTML=totInner(it);
      }
    }else{pendingRender=false;render()}
  },0);
}

  setTimeout(function(){if(pendingRender&&!inlineActive()){pendingRender=false;render()}},0);
});

function sortList(l){return l.map(function(x,i){return[x,i]}).sort(function(a,b){return (a[0].done-b[0].done)||(a[1]-b[1])}).map(function(p){return p[0]})}
function allNames(){
  var s={};data.agent.forEach(function(it){it.buyers.forEach(function(b){var k=(b.who||'').trim();if(k)s[k]=1})});
  return Object.keys(s);
}
var TINTS=[['#e3d2b4','#7d6240'],['#d8c9ad','#6b5a3e'],['#e7d6c3','#86583a'],['#d3d3b8','#5f6642'],['#dfcfc0','#7a5648'],['#cfd2c2','#56624f']];
function ph(img,name){
  if(okImg(img))return '<img src="'+img+'" alt="">';
  var n=(name||'').trim();if(!n)return '無圖片';
  var h=0;for(var i=0;i<n.length;i++)h=(h*31+n.charCodeAt(i))%997;
  var t=TINTS[h%TINTS.length];
  return '<span class="phch" style="background:'+t[0]+';color:'+t[1]+'">'+esc(Array.from(n)[0])+'</span>';
}
function totInner(it){
  var tot=0,got=0;
  it.buyers.forEach(function(b){tot+=num(b.qty);got+=(b.got==null?num(b.qty):num(b.got))});
  var p=num(it.price),hp=!noPrice(it),short=it.done&&got<tot;
  return '<span class="'+(short?'flag':'meta')+'">'+(it.done?('實買 '+got+' ／ 需 '+tot+' 個'):('合計 '+tot+' 個'))+'</span>'+(hp?'<span class="amtc"><b>'+money(p*(it.done?got:tot))+'</b>'+(hasRate()?'<small>當地 '+loc(p*(it.done?got:tot))+'</small>':'')+'</span>':'<b><span class="flag">待填單價</span></b>');
}
function agentCard(it){
  var tot=0,got=0;
  it.buyers.forEach(function(b){tot+=num(b.qty);got+=(b.got==null?num(b.qty):num(b.got))});
  var p=num(it.price),hp=!noPrice(it);
  var chips=it.buyers.map(function(b){return '<span class="chip">'+esc((b.who||'').trim()||'未註明')+' ×'+num(b.qty)+'</span>'}).join('');

    '<button class="chk" data-check="'+it.id+'" type="button" aria-label="已購買">✓</button>'+
    '<div class="info">'+
      '<div class="name'+(it.name?'':' empty')+'">'+esc(it.name||'（未命名）')+'</div>'+
      '<div class="prow"><span class="meta">單價</span><span class="pwrap"><input type="number" inputmode="decimal" min="0" max="'+MAX_P+'" step="any" data-price="'+it.id+'" class="'+(hp?'':'nop')+'" value="'+esc(hp?it.price:'')+'" placeholder="現場填" aria-label="單價"></span></div>'+
      '<div class="chips">'+chips+'</div>'+grows+
      '<div class="tot">'+totInner(it)+'</div>'+
      '<button class="buybtn" data-check="'+it.id+'" type="button">'+(it.done?'☑ 已購買（再點一次取消）':'☐ 標記已購買')+'</button>'+

function mustCard(it){

/* ---------- 圖片處理 ---------- */
function readDataURL(file){
  return new Promise(function(res,rej){
    var r=new FileReader();
    r.onload=function(){res(r.result)};
    r.onerror=function(){rej(new Error('read'))};
    r.readAsDataURL(file);
  });
}
function loadImg(src){
  return new Promise(function(res,rej){
    var img=new Image();
    img.onload=function(){res(img)};
    img.onerror=function(){rej(new Error('decode'))};
    img.src=src;
  });
}
function toWork(src,w,h){
  var s=Math.min(1,2000/Math.max(w,h));
  var c=document.createElement('canvas');c.width=Math.max(1,Math.round(w*s));c.height=Math.max(1,Math.round(h*s));
  var x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);
  x.drawImage(src,0,0,c.width,c.height);
  return c;
}
function loadSource(file){
  var viaBitmap=function(){
    if(!window.createImageBitmap)return Promise.reject(new Error('nobitmap'));
    return createImageBitmap(file).then(function(bm){var c=toWork(bm,bm.width,bm.height);if(bm.close)bm.close();return c});
  };
  var viaReader=function(){
    return readDataURL(file).then(loadImg).then(function(img){return toWork(img,img.naturalWidth||img.width,img.naturalHeight||img.height)});
  };
  return viaBitmap().catch(viaReader);
}

/* ---------- 照片裁切：框固定、照片在底下移動／縮放 ---------- */
var cr=null;
function startCrop(src,ratio,done){
  cr={src:src,sw:src.width,sh:src.height,ratio:ratio,done:done,ptrs:{},s:0,cx:0,cy:0,w:0,h:0,fx:0,fy:0,fw:0,fh:0,min:1,dpr:1};
  $('#crop').classList.add('on');document.body.classList.add('lock');
  requestAnimationFrame(function(){layoutCrop(true)});
}
function closeCrop(){
  $('#crop').classList.remove('on');cr=null;
  if(!$('#sheet').classList.contains('on'))document.body.classList.remove('lock');
}
function layoutCrop(reset){
  if(!cr)return;
  var st=$('#cropStage'),cv=$('#cropCv'),r=st.getBoundingClientRect();
  cr.dpr=window.devicePixelRatio||1;
  cr.w=r.width||window.innerWidth||360;cr.h=r.height||((window.innerHeight||700)-200);
  cv.width=Math.round(cr.w*cr.dpr);cv.height=Math.round(cr.h*cr.dpr);
  var pad=20,maxW=Math.max(40,cr.w-pad*2),maxH=Math.max(40,cr.h-pad*2);
  var fw=maxW,fh=fw/cr.ratio;if(fh>maxH){fh=maxH;fw=fh*cr.ratio}
  cr.fw=fw;cr.fh=fh;cr.fx=(cr.w-fw)/2;cr.fy=(cr.h-fh)/2;
  cr.min=Math.max(fw/cr.sw,fh/cr.sh);
  if(reset||!cr.s){cr.s=cr.min;cr.cx=cr.sw/2;cr.cy=cr.sh/2}
  clampCrop();drawCrop();
}
function clampCrop(){
  cr.s=Math.min(cr.min*6,Math.max(cr.min,cr.s));
  var hx=cr.fw/(2*cr.s),hy=cr.fh/(2*cr.s);
  cr.cx=Math.min(cr.sw-hx,Math.max(hx,cr.cx));
  cr.cy=Math.min(cr.sh-hy,Math.max(hy,cr.cy));
  $('#cropZoom').value=Math.round((cr.s/cr.min-1)/5*100);
}
function drawCrop(){
  if(!cr)return;
  var cv=$('#cropCv'),x=cv.getContext('2d'),d=cr.dpr;
  x.setTransform(d,0,0,d,0,0);
  x.fillStyle='#1d1611';x.fillRect(0,0,cr.w,cr.h);
  var dx=cr.fx+cr.fw/2-cr.cx*cr.s,dy=cr.fy+cr.fh/2-cr.cy*cr.s;
  x.drawImage(cr.src,dx,dy,cr.sw*cr.s,cr.sh*cr.s);
  x.fillStyle='rgba(20,14,10,.62)';
  x.fillRect(0,0,cr.w,cr.fy);x.fillRect(0,cr.fy+cr.fh,cr.w,cr.h-cr.fy-cr.fh);
  x.fillRect(0,cr.fy,cr.fx,cr.fh);x.fillRect(cr.fx+cr.fw,cr.fy,cr.w-cr.fx-cr.fw,cr.fh);
  x.strokeStyle='rgba(255,255,255,.35)';x.lineWidth=1;x.beginPath();
  for(var i=1;i<3;i++){
    x.moveTo(cr.fx+cr.fw*i/3,cr.fy);x.lineTo(cr.fx+cr.fw*i/3,cr.fy+cr.fh);
    x.moveTo(cr.fx,cr.fy+cr.fh*i/3);x.lineTo(cr.fx+cr.fw,cr.fy+cr.fh*i/3);
  }
  x.stroke();
  x.strokeStyle='rgba(255,255,255,.95)';x.lineWidth=2;x.strokeRect(cr.fx,cr.fy,cr.fw,cr.fh);
}
function cropResult(){
  var long=900,ow,oh;
  if(cr.ratio>=1){ow=long;oh=Math.round(long/cr.ratio)}else{oh=long;ow=Math.round(long*cr.ratio)}
  var sw=cr.fw/cr.s,sh=cr.fh/cr.s;
  var sx=Math.max(0,Math.min(cr.sw-sw,cr.cx-sw/2)),sy=Math.max(0,Math.min(cr.sh-sh,cr.cy-sh/2));
  var c=document.createElement('canvas');c.width=ow;c.height=oh;
  var x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,ow,oh);
  x.drawImage(cr.src,sx,sy,sw,sh,0,0,ow,oh);
  return c.toDataURL('image/jpeg',0.8);
}
(function(){
  var cv=$('#cropCv');
  var dist=function(a,b){return Math.hypot(a.x-b.x,a.y-b.y)};
  cv.addEventListener('pointerdown',function(e){
    if(!cr)return;
    try{cv.setPointerCapture(e.pointerId)}catch(_){}
    cr.ptrs[e.pointerId]={x:e.clientX,y:e.clientY};
  });
  cv.addEventListener('pointermove',function(e){
    if(!cr||!cr.ptrs[e.pointerId])return;
    var ids=Object.keys(cr.ptrs),p=cr.ptrs[e.pointerId];
    if(ids.length>=2){
      var a=cr.ptrs[ids[0]],b=cr.ptrs[ids[1]];
      var od=dist(a,b),om={x:(a.x+b.x)/2,y:(a.y+b.y)/2};
      p.x=e.clientX;p.y=e.clientY;
      var nd=dist(a,b),nm={x:(a.x+b.x)/2,y:(a.y+b.y)/2};
      if(od>0)cr.s*=nd/od;
      cr.cx-=(nm.x-om.x)/cr.s;cr.cy-=(nm.y-om.y)/cr.s;
    }else{
      cr.cx-=(e.clientX-p.x)/cr.s;cr.cy-=(e.clientY-p.y)/cr.s;
      p.x=e.clientX;p.y=e.clientY;
    }
    clampCrop();drawCrop();
  });
  var up=function(e){if(cr)delete cr.ptrs[e.pointerId]};
  cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
  cv.addEventListener('wheel',function(e){
    if(!cr)return;e.preventDefault();
    cr.s*=Math.exp(-e.deltaY*0.002);clampCrop();drawCrop();
  },{passive:false});
  $('#cropZoom').addEventListener('input',function(){
    if(!cr)return;cr.s=cr.min*(1+num(this.value)/100*5);clampCrop();drawCrop();
  });
  $('#cropRot').addEventListener('click',function(){
    if(!cr)return;
    var s=cr.src,c=document.createElement('canvas');c.width=s.height;c.height=s.width;
    var x=c.getContext('2d');x.translate(c.width,0);x.rotate(Math.PI/2);x.drawImage(s,0,0);
    cr.src=c;cr.sw=c.width;cr.sh=c.height;layoutCrop(true);
  });
  $('#cropNo').addEventListener('click',closeCrop);
  $('#cropOk').addEventListener('click',function(){
    if(!cr)return;
    var done=cr.done,url;
    try{url=cropResult()}catch(e){toast('裁切失敗，請換一張照片試試');closeCrop();return}
    closeCrop();done(url);
  });
  window.addEventListener('resize',function(){if(cr)layoutCrop(false)});
})();
function fileInfo(f){return (f&&f.type?f.type:'未知格式')+(f&&f.size?'，'+Math.round(f.size/1024)+'KB':'')}

/* ---------- 新增 / 編輯 ---------- */
var draft=null,draftKind='',isNew=false;
function openItem(kind,id){
  draftKind=kind;
  var src=id?data[kind].filter(function(x){return x.id===id})[0]:null;
  isNew=!src;
  if(src)draft=JSON.parse(JSON.stringify(src));
  else draft=kind==='agent'?{id:uid(),img:'',name:'',price:'',done:false,buyers:[{who:'',qty:1,got:null}]}:{id:uid(),img:'',qty:'',done:false};
  if(kind==='agent'&&!draft.buyers.length)draft.buyers.push({who:'',qty:1,got:null});
  drawForm();
}
function drawForm(){
  var k=draftKind;
  var h='<div class="sh"><h2>'+(isNew?'新增':'編輯')+(k==='agent'?'代購商品':'必買商品')+'</h2>'+(isNew?'':'<button class="trash" id="delTop" type="button">🗑 刪除</button>')+'</div>';
  h+='<div class="field"><div class="imgpick'+(k==='agent'?'':' sq')+'" id="pick">'+(okImg(draft.img)?'<img src="'+draft.img+'" alt=""><span class="re">更換圖片</span>':'點此從相簿選照片<br>或拍照')+'</div><div class="hint">選好照片後，可以拖曳、縮放來裁切範圍</div></div>';
  if(k==='agent'){
    h+='<div class="field"><label>商品名稱（選填）</label><input type="text" id="fName" maxlength="40" value="'+esc(draft.name)+'" placeholder="例如：保濕乳液"></div>';
    h+='<div class="field"><label>單價（到現場再填也可以）</label><input type="number" id="fPrice" inputmode="decimal" min="0" max="'+MAX_P+'" step="any" value="'+esc(draft.price)+'" placeholder="現場填"></div>';
    h+='<div class="field"><label>代購人與數量</label><div class="bhead"><span>代購人</span><span>要買</span>'+(draft.done?'<span>實買</span>':'')+'</div><div id="buyers"></div>'+
       '<button class="btn ghost small" id="addB" type="button">＋ 加一位代購人</button>'+
       '<div class="hint">同一個商品有多人要買時，在這裡加人即可，卡片會自動合計數量。</div></div>';
  }else{
    h+='<div class="field"><label>數量（選填）</label><input type="number" id="fQty" inputmode="numeric" min="0" max="'+MAX_Q+'" value="'+esc(draft.qty)+'" placeholder="不填就不顯示"></div>';
  }
  h+='<div class="field"><div class="toggle"><span>已購買</span><label class="sw"><input type="checkbox" id="fDone"'+(draft.done?' checked':'')+' aria-label="已購買"><i></i></label></div>'+
     (k==='agent'?'<div class="hint">打開後可填「實買」數量，買不齊時再改；沒改就視為買齊。</div>':'')+'</div>';
  if(!isNew)h+='<div class="field"><button class="btn danger small" id="delBtn" type="button">刪除這個商品</button></div>';
  h+='<div class="actbar"><div class="row2" style="margin-top:0"><button class="btn ghost" id="cancel" type="button">取消</button><button class="btn" id="saveBtn" type="button">儲存</button></div></div>';
  openSheet(h);
  bindForm();
}
function drawBuyers(){
  var box=$('#buyers');if(!box)return;
  box.innerHTML=draft.buyers.map(function(b,i){
    return '<div class="brow">'+
      '<input type="text" class="who" list="people" maxlength="16" data-i="'+i+'" data-f="who" value="'+esc(b.who)+'" placeholder="姓名">'+
      '<input type="number" class="q" inputmode="numeric" min="0" max="'+MAX_Q+'" data-i="'+i+'" data-f="qty" value="'+esc(b.qty)+'">'+
      (draft.done?'<input type="number" class="q" inputmode="numeric" min="0" max="'+MAX_Q+'" data-i="'+i+'" data-f="got" value="'+esc(b.got==null?b.qty:b.got)+'">':'')+
      '<button class="del" data-del="'+i+'" type="button" aria-label="移除">✕</button></div>';
  }).join('');
}
function deleteDraft(){
  askConfirm('確定刪除這個商品？\n此動作無法復原。','刪除').then(function(ok){
    if(!ok)return;
    data[draftKind]=data[draftKind].filter(function(x){return x.id!==draft.id});
    save();closeSheet();render();toast('已刪除');
  });
}
function bindForm(){
  $('#pick').onclick=function(){$('#fileImg').value='';$('#fileImg').click()};
  $('#cancel').onclick=closeSheet;
  $('#fDone').onchange=function(){draft.done=this.checked;if(draftKind==='agent'){syncText();drawBuyers();drawFormHead()}};
  if(draftKind==='agent'){
    drawBuyers();
    $('#fName').oninput=function(){draft.name=this.value};
    $('#fPrice').oninput=function(){draft.price=this.value};
    $('#addB').onclick=function(){syncText();draft.buyers.push({who:'',qty:1,got:null});drawBuyers()};
    $('#buyers').oninput=function(e){
      var t=e.target,i=t.dataset.i,f=t.dataset.f;if(i==null||!draft.buyers[i])return;
      if(f==='who')draft.buyers[i].who=t.value;
      else if(f==='qty')draft.buyers[i].qty=t.value;
      else if(f==='got')draft.buyers[i].got=t.value;
    };
    $('#buyers').onclick=function(e){
      var d=e.target.getAttribute('data-del');if(d==null)return;
      if(draft.buyers.length<=1){toast('至少要有一位代購人');return}
      draft.buyers.splice(+d,1);drawBuyers();
    };
  }else{
    $('#fQty').oninput=function(){draft.qty=this.value};
  }
  $('#saveBtn').onclick=saveDraft;
  var del=$('#delBtn');if(del)del.onclick=deleteDraft;
  var dt=$('#delTop');if(dt)dt.onclick=deleteDraft;
}
function syncText(){
  if(draftKind!=='agent')return;
  var n=$('#fName'),p=$('#fPrice');if(n)draft.name=n.value;if(p)draft.price=p.value;
}
function drawFormHead(){
  var bh=document.querySelector('.bhead');if(!bh)return;
  bh.innerHTML='<span>代購人</span><span>要買</span>'+(draft.done?'<span>實買</span>':'');
}
function saveDraft(){
  syncText();
  if(draftKind==='agent'){
    var name=clip(draft.name,40).trim();
    if(!draft.img&&!name){toast('請至少加入圖片或商品名稱');return}
    var bs=[];
    for(var i=0;i<draft.buyers.length;i++){
      var b=draft.buyers[i],who=clip(b.who,16).trim(),q=qint(b.qty);
      if(!who&&!q)continue;
      if(!q){toast('請填寫「'+who+'」要買的數量');return}
      var g=(b.got==null||b.got==='')?null:qint(b.got);
      if(g===q||!draft.done)g=null;
      bs.push({who:who,qty:q,got:g});
    }
    if(!bs.length){toast('請至少填一位代購人的數量');return}
    draft.buyers=bs;draft.name=name;
    draft.price=(draft.price===''||draft.price==null)?'':pnum(draft.price);
  }else{
    if(!draft.img){toast('必買區請先加入商品圖');return}
    var q2=qint(draft.qty);draft.qty=q2?q2:'';
  }
  var list=data[draftKind],idx=-1;
  list.forEach(function(x,i){if(x.id===draft.id)idx=i});
  if(idx>=0)list[idx]=draft;else list.push(draft);
  save();closeSheet();render();
}
$('#fileImg').addEventListener('change',function(){
  var f=this.files&&this.files[0],d0=draft,ratio=draftKind==='agent'?4/3:1;if(!f||!d0)return;
  loadSource(f).then(function(src){
    if(draft!==d0||!$('#sheet').classList.contains('on'))return;
    startCrop(src,ratio,function(url){
      if(draft!==d0||!$('#sheet').classList.contains('on'))return;
      d0.img=url;syncText();
      var keep=$('#sheet').scrollTop;
      drawForm();$('#sheet').scrollTop=keep;
    });
  }).catch(function(){toast('圖片無法讀取（'+fileInfo(f)+'）')});
});

/* ---------- 事件 ---------- */
function toggleDone(id){
  data[tab].forEach(function(x){
    if(x.id!==id)return;
    x.done=!x.done;
    if(!x.done&&x.buyers)x.buyers.forEach(function(b){b.got=null});
  });
  save();render();
  var c=document.querySelector('.card[data-id="'+id+'"]');
  if(c&&c.classList.contains('done'))c.classList.add('pop');
}
$('#main').addEventListener('click',function(e){
  if(e.target.closest('.prow'))return;
  var chk=e.target.closest('[data-check]');
  if(chk){toggleDone(chk.getAttribute('data-check'));return}
  var card=e.target.closest('.card');
  if(card)openItem(tab,card.getAttribute('data-id'));
});
$('#main').addEventListener('keydown',function(e){
  if((e.key==='Enter'||e.key===' ')&&e.target.classList&&e.target.classList.contains('card')){
    e.preventDefault();openItem(tab,e.target.getAttribute('data-id'));
  }
});
$('#main').addEventListener('change',function(e){
  var t=e.target,at=function(n){return t.getAttribute&&t.getAttribute(n)};
  var v=(t.value||'').trim();
  var mid=at('data-mqty');
  if(mid){
    var mq=qint(v);
    data.must.forEach(function(x){if(x.id===mid)x.qty=mq?mq:''});
    save();softRender();return;
  }
  var gid=at('data-got');
  if(gid){
    var bi=+at('data-bi');
    data.agent.forEach(function(x){if(x.id===gid&&x.buyers[bi]){var b=x.buyers[bi];b.got=v===''?null:qint(v);if(b.got===num(b.qty))b.got=null}});
    save();softRender(gid);return;
  }
  if(at('data-rate')){
    data.rate=rnum(v);save();softRender();return;
  }
  var pid=at('data-price');
  if(!pid)return;
  data.agent.forEach(function(x){if(x.id===pid)x.price=(v===''?'':pnum(v))});
  t.classList.toggle('nop',v==='');
  save();softRender(pid);
});
document.querySelectorAll('.tab').forEach(function(t){
  t.addEventListener('click',function(){
    tab=t.dataset.tab;try{localStorage.setItem('shoplist_tab',tab)}catch(e){}
    pendingRender=false;render();window.scrollTo(0,0);
  });
});
$('#fab').addEventListener('click',function(){if(!ready)return;openItem(tab,null)});

/* ---------- 選單：備份 / 匯入 / 重置 ---------- */
$('#menuBtn').addEventListener('click',function(){
  openSheet('<div class="sh"><h2>選單</h2></div>'+
    '<div class="field"><button class="btn" id="mExport" type="button">匯出備份</button><div class="hint">會產生一個 JSON 檔，內含所有商品、圖片與勾選狀態。換手機或清除 Safari 資料前請先備份。</div></div>'+
    '<div class="field"><button class="btn ghost" id="mImport" type="button">匯入備份</button><div class="hint">會用備份檔取代目前所有資料。</div></div>'+
    '<div class="field"><button class="btn ghost" id="mReset" type="button">取消全部打勾</button><div class="hint">商品保留，只把已購買狀態和實買數量清掉（下一趟購物用）。</div></div>'+
    '<div class="field"><button class="btn danger" id="mClear" type="button">清空目前這一區</button></div>'+
    '<div class="hint" style="text-align:center">版本 '+APP_VER+'</div>'+
    '<div class="actbar"><button class="btn ghost" id="mClose" type="button">關閉</button></div>');
  $('#mClose').onclick=closeSheet;
  $('#mExport').onclick=exportData;
  $('#mImport').onclick=function(){$('#fileImport').value='';$('#fileImport').click()};
  $('#mReset').onclick=function(){
    askConfirm('確定取消全部打勾？\n實買數量也會一併清掉。','取消打勾').then(function(ok){
      if(!ok)return;
      data.agent.forEach(function(it){it.done=false;it.buyers.forEach(function(b){b.got=null})});
      data.must.forEach(function(it){it.done=false});
      save();closeSheet();render();toast('已取消全部打勾');
    });
  };
  $('#mClear').onclick=function(){
    var nm=tab==='agent'?'代購區':'必買區';
    askConfirm('確定清空「'+nm+'」所有商品？\n此動作無法復原。','清空').then(function(ok){
      if(!ok)return;
      data[tab]=[];save();closeSheet();render();toast('已清空'+nm);
    });
  };
});
function exportData(){
  var d=new Date(),p=function(n){return String(n).padStart(2,'0')};
  var name='購買清單備份_'+d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+'.json';
  var blob=new Blob([JSON.stringify({version:1,exported:d.toISOString(),agent:data.agent,must:data.must,rate:data.rate})],{type:'application/json'});
  var file;try{file=new File([blob],name,{type:'application/json'})}catch(e){}
  if(file&&navigator.canShare&&navigator.canShare({files:[file]})){
    navigator.share({files:[file],title:'購買清單備份'}).catch(function(){});
    return;
  }
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;
  document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},1000);
}
$('#fileImport').addEventListener('change',function(){
  var f=this.files&&this.files[0];if(!f)return;
  var r=new FileReader();
  r.onerror=function(){toast('檔案讀取失敗')};
  r.onload=function(){
    var obj;
    try{
      obj=JSON.parse(r.result);
      if(!obj||typeof obj!=='object'||(!Array.isArray(obj.agent)&&!Array.isArray(obj.must)))throw new Error('format');
    }catch(e){toast('檔案格式不正確');return}
    askConfirm('匯入會取代目前所有資料，確定嗎？','匯入').then(function(ok){
      if(!ok)return;
      data=normalize(obj);save();closeSheet();render();toast('匯入完成');
    });
  };
  r.readAsText(f);
});

/* ---------- 網頁小圖示（沿用內嵌的主畫面圖示） ---------- */
(function(){
  var a=document.getElementById('touchIcon');if(!a)return;
  var l=document.createElement('link');l.rel='icon';l.type='image/png';l.href=a.getAttribute('href');
  document.head.appendChild(l);
})();

/* ---------- 啟動 ---------- */
function startWith(d){
  if(ready&&touched)return;
  try{data=normalize(d)}catch(e){data={agent:[],must:[],rate:0};toast('讀取舊資料失敗')}
  ready=true;render();
}
render();
DB.get('data').then(startWith).catch(function(){if(!ready){ready=true;render()}});
setTimeout(function(){if(!ready){ready=true;render()}},2500);
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(function(){});
})();
</script>
